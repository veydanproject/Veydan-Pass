[package]
name = "veydanpass"
version = "5.0.4"
description = "Passwords, TOTP, the password generator and its history"
authors = ["Veydan Project"]
edition = "2021"
license-file = "../../LICENSE"
publish = false

[lib]
# One library for every platform: desktop main.rs and the Android bootstrap load it.
name = "veydan_pass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The product crate names what tauri-build and generate_context! read
# (internal/platform-spec.md 5.5): tauri with the features of its config,
# serde_json for the `plugins` section, every plugin its capabilities name.
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# The module contract, the command router, the app builder, the tray frame.
veydan-shell = { path = "../../crates/shell" }
# The module Pass: passwords, TOTP, the history of the password generator.
veydan-pass = { path = "../../crates/pass" }

# ── Desktop only: the plugins the shell registers ────────────────────────────
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Open http(s) links in the system browser without going through a shell
tauri-plugin-opener = "2"

# ── Mobile only ──────────────────────────────────────────────────────────────
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The camera reads the QR code of a TOTP secret; the module of pass
# registers the plugin, the product names it for its permissions.
tauri-plugin-barcode-scanner = "2"
# Native file picker (content:// URIs) and fd-based reads of those URIs.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
