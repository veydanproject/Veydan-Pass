#
# Root workspace of Veydan Pass: the application and the crates it is built
# from share one lock file and one target directory (data/target, from
# .cargo/config.toml). Build and check it by name:
#
#   cargo check -p veydanpass

[workspace]
resolver = "2"
members = ["apps/pass", "crates/build-cfg", "crates/core", "crates/lock", "crates/pass", "crates/shell", "crates/sync", "crates/sync-host"]

[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
# tao 0.35.3 with the scene configuration of iOS kept alive for UIKit (the
# launch crash of the TestFlight build; tao 0.36 has it) and the link of a
# cold start on iOS sent as `Opened` (vendor/tao/PATCH.md).
tao = { path = "vendor/tao" }

[profile.release]
# Symbol tables go; the dynamic exports (Tauri's and the push handler's
# `Java_*`) stay. Android packages the library as cargo leaves it, and a
# push starts a process that loads the whole of it before it can answer.
strip = "symbols"
